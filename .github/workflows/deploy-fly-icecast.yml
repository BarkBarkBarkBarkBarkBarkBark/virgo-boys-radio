name: Deploy Icecast on existing Fly app

# A one-time push trigger deploys this workflow when it is first merged.
# Future redeployments are explicit via Actions -> Run workflow.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-fly-icecast.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-wst-prt-radio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require Fly app-scoped deploy token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$FLY_API_TOKEN" ]]; then
            echo "::error::FLY_API_TOKEN is not set. Run 'fly tokens create deploy --app wst-prt-radio' locally, then add the output as GitHub repository Actions secret FLY_API_TOKEN."
            exit 1
          fi

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200

      - name: Deploy the repository Docker image to the existing Fly app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false --app wst-prt-radio --config fly.toml

      - name: Confirm API survived the deployment
        shell: bash
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 5 https://wst-prt-radio.fly.dev/health; then
              echo "Fastify is healthy behind Caddy."
              exit 0
            fi
            sleep 3
          done
          echo "::error::The Fly API health check did not recover after deployment."
          exit 1

      - name: Summarize activation requirements
        run: |
          echo "Image deployed. Icecast is packaged but disabled by default." >> "$GITHUB_STEP_SUMMARY"
          echo "Configure three private Fly Icecast passwords and ICECAST_ENABLED=true before broadcasting." >> "$GITHUB_STEP_SUMMARY"
          echo "Do not set the Vercel stream URL until an end-to-end encoder-to-browser test passes." >> "$GITHUB_STEP_SUMMARY"
